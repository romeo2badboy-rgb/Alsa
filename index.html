<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>ALFA — VR Interactive Character</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #808080;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #fff;
        width: 100vw;
        height: 100vh;
      }

      #canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* ── Overlay — forwarded into VR via DOM Overlay API ── */
      #overlay {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 100;
      }

      /* ── Debug panel ── */
      #debug-panel {
        position: absolute;
        top: 10px; left: 10px;
        background: rgba(0,0,0,0.78);
        color: #00ff88;
        font-family: 'Courier New', Courier, monospace;
        font-size: 11px;
        padding: 10px 14px;
        border-radius: 6px;
        border: 1px solid rgba(0,255,136,0.25);
        line-height: 1.75;
        min-width: 230px;
        max-width: 310px;
        pointer-events: none;
        user-select: none;
      }

      /* ── Loading screen ── */
      #loading {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 600;
        gap: 18px;
        display: none;
      }

      #loading .spinner {
        width: 42px; height: 42px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.75s linear infinite;
      }

      #loading-text { font-size: 14px; opacity: 0.85; letter-spacing: 0.03em; }

      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Toast notification ── */
      #toast {
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%) translateY(20px);
        background: rgba(0,0,0,0.82);
        color: #fff;
        padding: 8px 18px;
        border-radius: 20px;
        font-size: 13px;
        border: 1px solid rgba(255,255,255,0.2);
        z-index: 700;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        pointer-events: none;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ── Instructions card ── */
      #instructions {
        position: fixed;
        top: 50%; left: 50%;
        transform: translate(-50%,-50%);
        background: rgba(15,15,20,0.92);
        padding: 28px 36px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.18);
        text-align: center;
        max-width: 420px;
        width: calc(100% - 40px);
        z-index: 400;
        display: none;
        line-height: 1.6;
      }
      #instructions h2  { margin-bottom: 12px; font-size: 16px; color: #ffd; }
      #instructions p   { margin: 6px 0; font-size: 13px; opacity: 0.85; }
      #instructions code {
        background: rgba(255,255,255,0.1);
        padding: 2px 7px;
        border-radius: 3px;
        font-family: monospace;
        font-size: 12px;
      }

      /* ── Control bar ── */
      #controls {
        position: fixed;
        bottom: 20px; left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        pointer-events: all;
        z-index: 200;
      }

      /* ── Buttons (base) ── */
      button {
        background: rgba(0,0,0,0.68);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.3);
        padding: 8px 16px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        letter-spacing: 0.02em;
        transition: background 0.18s, border-color 0.18s;
        white-space: nowrap;
        user-select: none;
      }
      button:hover    { background: rgba(60,60,70,0.88);  border-color: rgba(255,255,255,0.5); }
      button:active   { background: rgba(80,80,100,0.9); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }

      #vr-button {
        background: rgba(40,80,200,0.82);
        border-color: rgba(100,150,255,0.55);
        font-size: 14px;
        font-weight: 600;
        padding: 10px 26px;
      }
      #vr-button:hover { background: rgba(60,100,220,0.9); }

      #btn-camera {
        background: rgba(0,80,40,0.82);
        border-color: rgba(0,200,100,0.5);
      }
      #btn-camera:hover   { background: rgba(0,100,50,0.9); }
      #btn-camera.active  {
        background: rgba(0,200,80,0.3);
        border-color: rgba(0,255,136,0.7);
        color: #00ff88;
      }

      #btn-characters {
        background: rgba(80,20,120,0.82);
        border-color: rgba(180,80,255,0.5);
      }
      #btn-characters:hover  { background: rgba(100,30,150,0.9); }
      #btn-characters.active { background: rgba(140,60,220,0.35); border-color: rgba(180,80,255,0.8); }

      #btn-animations {
        background: rgba(120,60,0,0.82);
        border-color: rgba(255,160,40,0.5);
      }
      #btn-animations:hover  { background: rgba(150,80,0,0.9); }
      #btn-animations.active { background: rgba(200,100,0,0.35); border-color: rgba(255,160,40,0.8); }

      button.active {
        background: rgba(0,180,100,0.25);
        border-color: rgba(0,255,136,0.55);
        color: #00ff88;
      }

      /* ── Camera PiP (picture-in-picture) ── */
      #camera-pip {
        position: fixed;
        bottom: 70px; left: 12px;
        width: 240px; height: 180px;
        border-radius: 10px;
        overflow: hidden;
        border: 2px solid rgba(0,255,136,0.45);
        background: #000;
        z-index: 300;
        display: none;
        box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      }
      #camera-pip.active { display: block; }

      #camera-pip-label {
        position: absolute;
        top: 6px; left: 8px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #00ff88;
        background: rgba(0,0,0,0.55);
        padding: 2px 6px;
        border-radius: 3px;
        pointer-events: none;
        z-index: 2;
      }

      #camera-video {
        width: 100%; height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* mirror — shows selfie view */
        display: block;
      }

      /* Canvas overlaid on top of the video inside the PiP */
      #hand-canvas {
        position: absolute;
        inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
      }

      /* ── Shared picker panel styles ── */
      .picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
        flex-shrink: 0;
      }
      .picker-close {
        padding: 2px 8px;
        font-size: 15px;
        background: none;
        border: none;
        color: rgba(255,255,255,0.45);
      }
      .picker-close:hover { color: #fff; background: none; }

      /* ── Model picker panel ── */
      #model-picker-panel {
        position: fixed;
        right: -280px; top: 0;
        width: 260px; height: 100vh;
        background: rgba(12,10,22,0.97);
        border-left: 1px solid rgba(255,255,255,0.1);
        z-index: 500;
        transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #model-picker-panel.open { right: 0; }

      .picker-body {
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        overflow-y: auto;
      }
      .picker-body::-webkit-scrollbar { width: 4px; }
      .picker-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

      .model-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.09);
        border-radius: 9px;
        text-align: left;
        width: 100%;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      .model-card:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.25); }
      .model-card.selected {
        background: rgba(0,180,100,0.15);
        border-color: rgba(0,255,136,0.45);
        color: #00ff88;
      }
      .model-emoji { font-size: 22px; line-height: 1; }
      .model-name  { font-size: 13px; font-weight: 500; }

      /* ── Animation picker panel ── */
      #anim-picker-panel {
        position: fixed;
        right: -310px; top: 0;
        width: 290px; height: 100vh;
        background: rgba(12,10,22,0.97);
        border-left: 1px solid rgba(255,255,255,0.1);
        z-index: 500;
        transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #anim-picker-panel.open { right: 0; }

      .anim-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 8px 10px;
        border-bottom: 1px solid rgba(255,255,255,0.07);
        flex-shrink: 0;
      }
      .anim-tab {
        padding: 4px 9px;
        font-size: 11px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 4px;
        color: rgba(255,255,255,0.65);
        cursor: pointer;
        white-space: nowrap;
      }
      .anim-tab:hover  { background: rgba(255,255,255,0.1); color: #fff; }
      .anim-tab.active {
        background: rgba(60,120,255,0.3);
        border-color: rgba(100,160,255,0.55);
        color: #fff;
      }

      .anim-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .anim-list::-webkit-scrollbar { width: 4px; }
      .anim-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

      .anim-btn {
        padding: 8px 12px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 6px;
        text-align: left;
        font-size: 12px;
        color: rgba(255,255,255,0.82);
        cursor: pointer;
        transition: background 0.12s;
        width: 100%;
      }
      .anim-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
      .anim-btn.selected {
        background: rgba(255,140,0,0.2);
        border-color: rgba(255,180,60,0.45);
        color: #ffb840;
      }

      /* ── Backdrop for panels (click to close) ── */
      #panel-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 499;
        background: transparent;
      }
      #panel-backdrop.active { display: block; }
    </style>
  </head>

  <body>
    <!-- Main 3-D canvas -->
    <canvas id="canvas"></canvas>

    <!-- Overlay — shown in VR via the DOM Overlay API -->
    <div id="overlay">
      <div id="debug-panel">Initializing…</div>
    </div>

    <!-- Toast notification -->
    <div id="toast"></div>

    <!-- Full-screen loading indicator -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Loading…</div>
    </div>

    <!-- Instructions shown when no model is loaded -->
    <div id="instructions">
      <h2>No VRM Model Found</h2>
      <p>
        Use the <b>Characters</b> button to pick a character from the<br />
        built-in asset pack, or paste a direct URL below.
      </p>
      <p style="margin-top:8px; font-size:12px; opacity:0.6;">
        Or place <code>character.vrm</code> at <code>public/models/</code>
      </p>
      <button style="margin-top:14px;" id="btn-open-chars-from-dialog">
        👤 Open Character Picker
      </button>
      <button style="margin-top:8px;" onclick="document.getElementById('instructions').style.display='none'">
        ✕ Close
      </button>
    </div>

    <!-- Camera picture-in-picture — shows when camera hand tracking is active -->
    <div id="camera-pip">
      <span id="camera-pip-label">📷 Hand Tracking</span>
      <video id="camera-video" autoplay muted playsinline></video>
      <canvas id="hand-canvas"></canvas>
    </div>

    <!-- Backdrop that closes open panels when clicked -->
    <div id="panel-backdrop"></div>

    <!-- Main control bar (bottom) -->
    <div id="controls">
      <button id="vr-button">Enter VR</button>
      <button id="btn-camera"        title="Toggle camera hand tracking">📷 Camera</button>
      <button id="btn-characters"    title="Pick a VRM character">👤 Characters</button>
      <button id="btn-animations"    title="Browse animations">🎭 Animations</button>
      <button id="btn-toggle-debug"  title="Toggle debug overlay">Debug</button>
      <button id="btn-toggle-colliders" title="Toggle collider wireframes">Colliders</button>
      <button id="btn-toggle-skeleton"  title="Toggle skeleton helper">Skeleton</button>
      <button id="btn-copy-debug"       title="Copy debug data to clipboard">Copy Debug</button>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
